name: Base Coverage Upload

on:
  push:
    branches:
      - develop
      - 'release_**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-base-coverage:
    name: Upload Base Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: rockylinux:8

    env:
      GRADLE_USER_HOME: /github/home/.gradle
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          dnf -y install java-1.8.0-openjdk-devel git wget unzip which jq bc curl glibc-langpack-en
          dnf -y groupinstall "Development Tools"

      - name: Check Java version
        run: java -version

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Stop Gradle daemon
        run: ./gradlew --stop || true

      - name: Build and generate JaCoCo report
        run: |
          ./gradlew clean build jacocoTestReport --no-daemon --no-build-cache

      - name: Show coverage files
        run: |
          find . -path "*/build/reports/jacoco/test/jacocoTestReport.xml" -type f | sort

      - name: Upload base coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/reports/jacoco/test/jacocoTestReport.xml"
          disable_search: true
          fail_ci_if_error: true
          verbose: true