name: Codecov Upload

on:
  workflow_run:
    workflows: ["RockyLinux Coverage Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  upload-coverage:
    name: Upload Coverage
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-rockylinux
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          path: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata artifact
        id: meta
        shell: bash
        run: |
          echo "number=$(cat pr-meta/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "base=$(cat pr-meta/base_ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate base branch
        shell: bash
        run: |
          base="${{ steps.meta.outputs.base }}"
          if [[ "$base" != "develop" && "$base" != release_* ]]; then
            echo "Unsupported base branch: $base"
            exit 1
          fi

      - name: Fetch PR info from GitHub API
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.meta.outputs.number }}');
            const { owner, repo } = context.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            core.info(`PR #${pr.number}`);
            core.info(`head.sha = ${pr.head.sha}`);
            core.info(`head.ref = ${pr.head.ref}`);
            core.info(`head.label = ${pr.head.label}`);
            core.info(`base.ref = ${pr.base.ref}`);

            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('label', pr.head.label);
            core.setOutput('base', pr.base.ref);

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Coverage files:"
          find coverage -type f | sort
          echo
          echo "PR metadata files:"
          find pr-meta -type f | sort
          echo
          echo "Resolved PR info:"
          echo "PR number: ${{ steps.pr.outputs.number }}"
          echo "Head SHA:  ${{ steps.pr.outputs.sha }}"
          echo "Head ref:  ${{ steps.pr.outputs.ref }}"
          echo "Head label:${{ steps.pr.outputs.label }}"
          echo "Base ref:  ${{ steps.pr.outputs.base }}"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/jacocoTestReport.xml
          disable_search: true
          override_commit: ${{ steps.pr.outputs.sha }}
          override_branch: ${{ steps.pr.outputs.label }}
          override_pr: ${{ steps.pr.outputs.number }}
          fail_ci_if_error: true
          verbose: true