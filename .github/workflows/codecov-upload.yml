name: Codecov Upload

on:
  workflow_run:
    workflows: ["RockyLinux Coverage Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  upload-coverage:
    name: Upload Coverage
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-rockylinux
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          path: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        shell: bash
        run: |
          echo "number=$(cat pr-meta/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr-meta/head_sha.txt)" >> "$GITHUB_OUTPUT"
          echo "ref=$(cat pr-meta/head_ref.txt)" >> "$GITHUB_OUTPUT"
          echo "base=$(cat pr-meta/base_ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate base branch
        shell: bash
        run: |
          base="${{ steps.pr.outputs.base }}"
          if [[ "$base" != "develop" && "$base" != release_* ]]; then
            echo "Unsupported base branch: $base"
            exit 1
          fi

      - name: Show downloaded files
        run: |
          echo "Coverage files:"
          find coverage -type f | sort
          echo "PR metadata files:"
          find pr-meta -type f | sort

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/jacocoTestReport.xml
          disable_search: true
          override_commit: ${{ steps.pr.outputs.sha }}
          override_branch: ${{ steps.pr.outputs.ref }}
          override_pr: ${{ steps.pr.outputs.number }}
          fail_ci_if_error: true