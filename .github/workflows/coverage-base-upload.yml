name: Base Coverage Upload

on:
  push:
    branches: [ 'develop', 'release_**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-coverage:
    name: Build Base Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: rockylinux:8

    env:
      GRADLE_USER_HOME: /github/home/.gradle
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euxo pipefail
          dnf -y install java-1.8.0-openjdk-devel git wget unzip which jq bc curl glibc-langpack-en
          dnf -y groupinstall "Development Tools"

      - name: Check Java version
        run: java -version

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Stop Gradle daemon
        run: ./gradlew --stop || true

      - name: Build
        run: ./gradlew framework:test --tests org.tron.core.zksnark.ShieldedReceiveTest

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport --no-daemon --no-build-cache

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-jacoco-xml
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: error

  upload-base-coverage:
    name: Upload Base Coverage to Codecov
    needs: build-base-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: base-jacoco-xml
          path: coverage-artifacts

      - name: Find coverage report
        id: find_report
        run: |
          report_path=$(find coverage-artifacts -name jacocoTestReport.xml)
          echo "report_path=${report_path}" >> "$GITHUB_OUTPUT"

      - name: Show coverage files
        run: |
          echo "Found report at: ${{ steps.find_report.outputs.report_path }}"
          find coverage-artifacts -type f | sort

      - name: Upload base coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.find_report.outputs.report_path }}
          disable_search: true
          override_branch: ${{ github.ref_name }}
          fail_ci_if_error: true
          verbose: true
