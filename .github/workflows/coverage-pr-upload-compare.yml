name: Codecov Upload & Compare

on:
  workflow_run:
    workflows:
      - Coverage Build
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  upload-coverage:
    name: Upload Coverage
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # must download source code
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headOwner = context.payload.workflow_run.head_repository.owner.login;
            const headBranch = context.payload.workflow_run.head_branch;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${headBranch}`
            });
            if (pulls.length > 0) {
              const pr = pulls[0];
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_sha', headSha);
              core.setOutput('pr_branch', headBranch);
              core.setOutput('base_sha', pr.base.sha);
            }

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_commit: ${{ steps.pr.outputs.pr_sha }}
          override_branch: ${{ steps.pr.outputs.pr_branch }}
          override_pr: ${{ steps.pr.outputs.pr_number }}
          fail_ci_if_error: true
          verbose: true

  compare-coverage:
    name: Compare Coverage
    needs: upload-coverage
    runs-on: ubuntu-latest
    ##if: needs.upload-coverage.outputs.pr_number

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headOwner = context.payload.workflow_run.head_repository.owner.login;
            const headBranch = context.payload.workflow_run.head_branch;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${headBranch}`
            });
            if (pulls.length > 0) {
              const pr = pulls[0];
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_sha', headSha);
              core.setOutput('base_sha', pr.base.sha);
            }

      - name: Generate coverage diff
        run: |
          BASE_SHA=${{ steps.pr.outputs.base_sha }}
          HEAD_SHA=${{ steps.pr.outputs.pr_sha }}
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.CODECOV_TOKEN }}" \
            "https://api.codecov.io/api/v2/github/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}")
          echo "## Coverage Comparison" > coverage_diff.txt
          echo "" >> coverage_diff.txt
          echo "$RESPONSE" | jq -r '.diff.totals | "- Coverage: \(.coverage)%\n- Lines covered: \(.hits)\n- Lines total: \(.lines)\n- Files changed: \(.files)"' >> coverage_diff.txt

      - name: Post coverage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.pr.outputs.pr_number }} --body-file coverage_diff.txt
