name: Codecov Upload & Compare

on:
  workflow_run:
    workflows:
      - Coverage Build
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  upload-coverage:
    name: Upload Coverage
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # must download source code
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            if (pr) {
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_sha', context.payload.workflow_run.head_sha);
              core.setOutput('pr_branch', context.payload.workflow_run.head_branch);
              core.setOutput('base_sha', pr.base.sha);
            }

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_commit: ${{ steps.pr.outputs.pr_sha }}
          override_branch: ${{ steps.pr.outputs.pr_branch }}
          override_pr: ${{ steps.pr.outputs.pr_number }}
          fail_ci_if_error: true
          verbose: true

  compare-coverage:
    name: Compare Coverage
    needs: upload-coverage
    runs-on: ubuntu-latest
    if: needs.upload-coverage.outputs.pr_number

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            if (pr) {
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_sha', context.payload.workflow_run.head_sha);
              core.setOutput('base_sha', pr.base.sha);
            }

      - name: Install Codecov
        run: pip install codecov

      - name: Generate coverage diff
        run: |
          codecov diff --token ${{ secrets.CODECOV_TOKEN }} ${{ steps.pr.outputs.base_sha }} ${{ steps.pr.outputs.pr_sha }} > coverage_diff.txt

      - name: Post coverage comment
        run: |
          gh pr comment ${{ steps.pr.outputs.pr_number }} --body-file coverage_diff.txt
