name: Coverage Build

on:
  pull_request:
    branches: [ 'develop', 'release_**' ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-coverage:
    name: Build Coverage (JDK8)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check Java version
        run: java -version

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Stop Gradle daemon
        run: ./gradlew --stop || true

      - name: Build
        run: ./gradlew clean build --no-daemon --no-build-cache
#        run: ./gradlew framework:test --tests org.tron.core.zksnark.ShieldedReceiveTest

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport --no-daemon --no-build-cache

      - name: Save PR metadata
        run: |
          mkdir -p pr-meta
          echo "${{ github.event.pull_request.number }}" > pr-meta/pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-meta/head_sha.txt
          echo "${{ github.event.pull_request.head.ref }}" > pr-meta/head_ref.txt
          echo "${{ github.event.pull_request.head.label }}" > pr-meta/head_label.txt
          echo "${{ github.event.pull_request.base.ref }}" > pr-meta/base_ref.txt

      - name: Upload JaCoCo artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: error

      - name: Upload PR metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-meta/*
          if-no-files-found: error
